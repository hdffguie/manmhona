name: Auto Website Review & YouTube Upload

on:
  schedule:
    - cron: '30 22 * * *'  # Subha 5:27 AM ke liye
    - cron: '30 12 * * *'  # Shaam 8:26 PM ke liye
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install Dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y ffmpeg -qq
        pip install -r requirements.txt
        playwright install chromium
        playwright install-deps chromium

    - name: 1. Generate AI Script & Update URL List
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python auto_script.py

    - name: 1.5 Auto-Update websites.txt on GitHub
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add websites.txt
        git commit -m "🤖 Bot ne ek URL delete kar diya hai" || echo "No changes to commit"
        git push

    - name: 2. Bot Screen Recording & Highlighting
      run: python record_browser.py

    - name: 3. Merge Audio and Video
      run: python merge_final.py

    - name: 4. Upload & Schedule on YouTube
      env:
        YOUTUBE_TOKEN_BASE64: ${{ secrets.YOUTUBE_TOKEN_BASE64 }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python upload_youtube.py
      
    - name: 5. Save Video to GitHub Artifacts (Backup)
      uses: actions/upload-artifact@v4
      with:
        name: Final-Website-Review
        path: |
          final_output/
          bot_commands.json
