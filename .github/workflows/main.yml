name: Auto Website Review & YouTube Upload

on:
  schedule:
    - cron: '30 22 * * *'  # Subha ki video ke liye (Raat ko chalega)
    - cron: '30 12 * * *'  # Shaam ki video ke liye (Dopahar me chalega)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install Dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y ffmpeg -qq
        pip install -r requirements.txt
        playwright install chromium
        playwright install-deps chromium

    - name: 1. Generate AI Script & JSON Commands
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python auto_script.py

    - name: 2. Bot Screen Recording & Highlighting
      run: python record_browser.py

    - name: 3. Merge Audio and Video
      run: python merge_final.py

    - name: 4. Upload & Schedule on YouTube
      env:
        YOUTUBE_TOKEN_BASE64: ${{ secrets.YOUTUBE_TOKEN_BASE64 }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python upload_youtube.py
      
    - name: 5. Save Video to GitHub (Backup)
      uses: actions/upload-artifact@v4
      with:
        name: Final-Website-Review
        path: |
          final_output/
          bot_commands.json
